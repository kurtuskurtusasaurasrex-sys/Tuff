name: Build SigmaCinematic

on:
  push:
    paths: ["SigmaCinematic/**", ".github/workflows/build-sigmacinematic.yml"]
  pull_request:
    paths: ["SigmaCinematic/**", ".github/workflows/build-sigmacinematic.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: SigmaCinematic
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Latest Paper API versions
        run: curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -15 || true

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: SigmaCinematic
          path: SigmaCinematic/build/libs/*.jar

      # Publishes the jar as a direct download link (no GitHub login needed):
      # https://github.com/<owner>/<repo>/releases/download/sigmacinematic-latest/SigmaCinematic.jar
      - name: Publish download link
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/libs/SigmaCinematic-*.jar SigmaCinematic.jar
          gh release delete sigmacinematic-latest --yes --cleanup-tag || true
          gh release create sigmacinematic-latest SigmaCinematic.jar \
            --target "$GITHUB_SHA" \
            --title "SigmaCinematic (latest build)" \
            --notes "Latest SigmaCinematic build for Paper 26.2. Put SigmaCinematic.jar in your server's plugins folder."
